<div id="login-overlay" style="
    width: 320px;
    padding: 30px;
    background: #ffffff;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #333;
    display: flex;
    flex-direction: column;
    gap: 15px;
">
    <h2 id="form-title" style="margin: 0; text-align: center; color: #4caf50;">Farm Friend</h2>
    <p style="margin: 0; text-align: center; font-size: 14px; color: #666;">Enter your farm credentials</p>

    <input type="email" id="email" placeholder="Email" style="
        padding: 12px;
        border: 2px solid #eee;
        border-radius: 8px;
        font-size: 16px;
        outline: none;
    ">

    <input type="password" id="password" placeholder="Password" style="
        padding: 12px;
        border: 2px solid #eee;
        border-radius: 8px;
        font-size: 16px;
        outline: none;
    ">

    <button id="login-btn" style="
        padding: 12px;
        background: #4caf50;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
    ">Login</button>

    <button id="register-btn" style="
        padding: 12px;
        background: #2196f3;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
    ">Create Account</button>

    <p id="error-msg" style="
        margin: 0;
        text-align: center;
        font-size: 12px;
        color: #f44336;
        display: none;
    "></p>
</div>
