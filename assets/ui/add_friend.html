<div id="friend-overlay" style="
    width: 320px;
    padding: 30px;
    background: #ffffff;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #333;
    display: flex;
    flex-direction: column;
    gap: 15px;
">
    <h2 style="margin: 0; text-align: center; color: #2196f3;">Add Neighbor</h2>
    <p style="margin: 0; text-align: center; font-size: 14px; color: #666;">Enter email to find a neighbor</p>

    <input type="email" id="friend-email" placeholder="Email" style="
        padding: 12px;
        border: 2px solid #eee;
        border-radius: 8px;
        font-size: 16px;
        outline: none;
    ">

    <button id="search-btn" style="
        padding: 12px;
        background: #2196f3;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
    ">Find User</button>

    <div id="search-result"
        style="display: none; padding: 10px; background: #f5f5f5; border-radius: 8px; text-align: center;">
        <p id="result-name" style="margin: 0 0 10px 0; font-weight: bold;"></p>
        <button id="add-btn" style="
            padding: 8px 16px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        ">Add Friend</button>
    </div>

    <p id="error-msg" style="
        margin: 0;
        text-align: center;
        font-size: 12px;
        color: #f44336;
        display: none;
    "></p>

    <button id="cancel-btn" style="
        padding: 8px;
        background: none;
        color: #999;
        border: none;
        cursor: pointer;
        font-size: 14px;
    ">Cancel</button>
</div>
